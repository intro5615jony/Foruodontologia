    <path d="M 172 240 C 178 296, 214 348, 270 348 C 332 348, 388 290, 408 222 C 413 207, 423 212, 415 228 C 390 280, 342 364, 264 364 C 192 364, 152 306, 152 240 C 152 230, 169 230, 172 240 Z" stroke-width="1.5" />
