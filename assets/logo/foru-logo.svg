  </g>
  
  <!-- ODONTOLOGIA -->
  <text x="250" y="396" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="10" fill="#3B332D" text-anchor="middle">ODONTOLOGIA</text>
  
  <!-- ESPECIALIZADA with fine side lines -->
  <line x1="72" y1="428" x2="114" y2="428" stroke="#B88A5A" stroke-width="1.5" />
  <text x="250" y="433" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13.5" font-weight="600" letter-spacing="8" fill="#B88A5A" text-anchor="middle">ESPECIALIZADA</text>
  <line x1="386" y1="428" x2="428" y2="428" stroke="#B88A5A" stroke-width="1.5" />
